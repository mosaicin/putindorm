<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-labelledby="title description">
  <title id="title">Улитка с надписью «КГБ»</title>
  <desc id="description">Мультяшная зелёная улитка с коричневой спиральной раковиной, глазками на стебельках и надписью «КГБ».</desc>
  <defs>
