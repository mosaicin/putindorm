<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#10151f">
    <meta name="description" content="Обратный отсчёт до 26 октября 2028 года.">
    <title>Отсчёт до 26 октября 2028</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #10151f;
        color: #f4f6fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 1.5rem;
        background:
          radial-gradient(ellipse at 50% 0%, rgb(63 105 180 / 25%), transparent 55%),
          #10151f;
      }

      main {
        width: min(100%, 54rem);
        text-align: center;
      }

      .eyebrow {
        color: #91a9d4;
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0.8rem 0;
        font-size: clamp(2rem, 7vw, 4rem);
        line-height: 1.1;
      }

      .target {
        margin: 0 0 2.5rem;
        color: #b9c3d6;
        font-size: clamp(1rem, 3vw, 1.25rem);
      }

      .timer {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: clamp(0.5rem, 2vw, 1.25rem);
      }

      .unit {
        padding: clamp(1rem, 4vw, 2rem) 0.5rem;
        border: 1px solid #303b50;
        border-radius: 1rem;
        background: rgb(25 33 47 / 88%);
        box-shadow: 0 1rem 3rem rgb(0 0 0 / 18%);
      }

      .value {
        display: block;
        font-variant-numeric: tabular-nums;
        font-size: clamp(2rem, 8vw, 4.5rem);
        font-weight: 750;
        line-height: 1;
      }

      .label {
        display: block;
        margin-top: 0.75rem;
        color: #aab6cb;
        font-size: clamp(0.75rem, 2vw, 0.95rem);
      }

      @media (max-width: 420px) {
        .timer {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Обратный отсчёт</p>
      <h1>До важной даты</h1>
      <p class="target">26 октября 2028 года, 00:00 (Москва)</p>

      <section class="timer" aria-label="Оставшееся время">
        <div class="unit"><span class="value" id="days">--</span><span class="label">дней</span></div>
        <div class="unit"><span class="value" id="hours">--</span><span class="label">часов</span></div>
        <div class="unit"><span class="value" id="minutes">--</span><span class="label">минут</span></div>
        <div class="unit"><span class="value" id="seconds">--</span><span class="label">секунд</span></div>
      </section>
    </main>

    <script>
      const deadline = new Date("2028-10-26T00:00:00+03:00").getTime();
      const second = 1000;
      const minute = 60 * second;
      const hour = 60 * minute;
      const day = 24 * hour;

      function updateCountdown() {
        const remaining = Math.max(0, deadline - Date.now());
        document.getElementById("days").textContent = Math.floor(remaining / day);
        document.getElementById("hours").textContent = String(Math.floor((remaining % day) / hour)).padStart(2, "0");
        document.getElementById("minutes").textContent = String(Math.floor((remaining % hour) / minute)).padStart(2, "0");
        document.getElementById("seconds").textContent = String(Math.floor((remaining % minute) / second)).padStart(2, "0");
      }

      updateCountdown();
      window.setInterval(updateCountdown, second);
    </script>
  </body>
</html>
